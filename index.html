<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenBook - Book Inventory System</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-600 rounded-lg text-white">
                    <i data-lucide="book-open" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white leading-none">OpenBook</h1>
                    <span class="text-xs text-indigo-400 font-medium">Inventory Management System</span>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="exportJSON()" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-slate-300 bg-slate-700 hover:bg-slate-600 rounded-md transition">
                    <i data-lucide="download" class="w-4 h-4"></i> Export JSON
                </button>
                <button onclick="openModal()" class="flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition shadow-lg shadow-indigo-600/30">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Book
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Stats Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-5 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Titles</p>
                    <p id="stat-total-titles" class="text-2xl font-bold text-white mt-1">0</p>
                </div>
                <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl">
                    <i data-lucide="library" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-5 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Copies</p>
                    <p id="stat-total-copies" class="text-2xl font-bold text-white mt-1">0</p>
                </div>
                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl">
                    <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-5 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total Stock Value</p>
                    <p id="stat-total-value" class="text-2xl font-bold text-emerald-400 mt-1">$0.00</p>
                </div>
                <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl">
                    <i data-lucide="dollar-sign" class="w-6 h-6"></i>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-5 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Low Stock Alerts</p>
                    <p id="stat-low-stock" class="text-2xl font-bold text-amber-400 mt-1">0</p>
                </div>
                <div class="p-3 bg-amber-500/10 text-amber-400 rounded-xl">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <!-- Controls: Search, Filter, View Toggle -->
        <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-4 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-80">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="renderInventory()" placeholder="Search title, author, ISBN..." 
                    class="w-full pl-9 pr-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select id="genre-filter" onchange="renderInventory()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="All">All Genres</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Non-Fiction">Non-Fiction</option>
                    <option value="Science Fiction">Science Fiction</option>
                    <option value="Technology">Technology</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Business">Business</option>
                </select>

                <select id="stock-filter" onchange="renderInventory()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="All">All Stock Levels</option>
                    <option value="inStock">In Stock (>5)</option>
                    <option value="lowStock">Low Stock (1-5)</option>
                    <option value="outOfStock">Out of Stock (0)</option>
                </select>

                <div class="flex items-center bg-slate-900 p-1 rounded-lg border border-slate-700 ml-auto md:ml-0">
                    <button id="btn-grid-view" onclick="setView('grid')" class="p-1.5 rounded text-indigo-400 bg-slate-800 hover:text-white transition">
                        <i data-lucide="layout-grid" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-table-view" onclick="setView('table')" class="p-1.5 rounded text-slate-400 hover:text-white transition">
                        <i data-lucide="list" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Inventory Container -->
        <div id="inventory-container"></div>
    </main>

    <!-- Modal Form (Create / Edit Book) -->
    <div id="book-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transition-all scale-95 opacity-0 duration-200" id="modal-card">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-semibold text-white">Add New Book</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="book-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4">
                <input type="hidden" id="book-id">
                
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Book Title *</label>
                    <input type="text" id="field-title" required placeholder="e.g. Clean Code" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Author *</label>
                        <input type="text" id="field-author" required placeholder="e.g. Robert C. Martin" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">ISBN *</label>
                        <input type="text" id="field-isbn" required placeholder="978-0132350884" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Genre *</label>
                        <select id="field-genre" required class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                            <option value="Technology">Technology</option>
                            <option value="Fiction">Fiction</option>
                            <option value="Non-Fiction">Non-Fiction</option>
                            <option value="Science Fiction">Science Fiction</option>
                            <option value="Fantasy">Fantasy</option>
                            <option value="Business">Business</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Price ($) *</label>
                        <input type="number" id="field-price" step="0.01" min="0" required placeholder="29.99" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Quantity in Stock *</label>
                        <input type="number" id="field-quantity" min="0" required placeholder="10" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Cover Image URL</label>
                        <input type="url" id="field-cover" placeholder="https://..." class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div class="pt-4 flex justify-end gap-3 border-t border-slate-700">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 rounded-lg transition shadow-lg shadow-indigo-600/30">Save Book</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const initialBooks = [
            { id: '1', title: 'Clean Code', author: 'Robert C. Martin', isbn: '978-0132350884', genre: 'Technology', price: 38.99, quantity: 12, cover: 'https://images.unsplash.com/photo-1532012197267-da84d127e765?w=400&q=80' },
            { id: '2', title: 'Dune', author: 'Frank Herbert', isbn: '978-0441172719', genre: 'Science Fiction', price: 18.50, quantity: 4, cover: 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=400&q=80' },
            { id: '3', title: 'Atomic Habits', author: 'James Clear', isbn: '978-0735211292', genre: 'Non-Fiction', price: 21.00, quantity: 25, cover: 'https://images.unsplash.com/photo-1512820790803-83ca734da794?w=400&q=80' },
            { id: '4', title: 'Designing Data-Intensive Applications', author: 'Martin Kleppmann', isbn: '978-1449373320', genre: 'Technology', price: 45.00, quantity: 2, cover: 'https://images.unsplash.com/photo-1589829085413-56de8ae18c73?w=400&q=80' },
            { id: '5', title: 'The Pragmatic Programmer', author: 'Andrew Hunt & David Thomas', isbn: '978-0135957059', genre: 'Technology', price: 42.50, quantity: 0, cover: 'https://images.unsplash.com/photo-1541963463532-d68292c34b19?w=400&q=80' }
        ];

        let books = JSON.parse(localStorage.getItem('openbook_inventory')) || initialBooks;
        let currentView = 'grid';

        function saveBooks() {
            localStorage.setItem('openbook_inventory', JSON.stringify(books));
            updateStats();
            renderInventory();
        }

        function setView(view) {
            currentView = view;
            document.getElementById('btn-grid-view').className = view === 'grid' ? 'p-1.5 rounded text-indigo-400 bg-slate-800 hover:text-white transition' : 'p-1.5 rounded text-slate-400 hover:text-white transition';
            document.getElementById('btn-table-view').className = view === 'table' ? 'p-1.5 rounded text-indigo-400 bg-slate-800 hover:text-white transition' : 'p-1.5 rounded text-slate-400 hover:text-white transition';
            renderInventory();
        }

        function updateStats() {
            document.getElementById('stat-total-titles').innerText = books.length;
            document.getElementById('stat-total-copies').innerText = books.reduce((acc, b) => acc + parseInt(b.quantity || 0), 0);
            document.getElementById('stat-total-value').innerText = `$${books.reduce((acc, b) => acc + (parseFloat(b.price || 0) * parseInt(b.quantity || 0)), 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
            document.getElementById('stat-low-stock').innerText = books.filter(b => b.quantity > 0 && b.quantity <= 5).length;
        }

        function getStockBadge(qty) {
            if (qty <= 0) return `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20">Out of Stock</span>`;
            if (qty <= 5) return `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">Low Stock (${qty})</span>`;
            return `<span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">In Stock (${qty})</span>`;
        }

        function renderInventory() {
            const container = document.getElementById('inventory-container');
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const genreVal = document.getElementById('genre-filter').value;
            const stockVal = document.getElementById('stock-filter').value;

            const filtered = books.filter(book => {
                const matchesSearch = book.title.toLowerCase().includes(searchVal) || book.author.toLowerCase().includes(searchVal) || book.isbn.toLowerCase().includes(searchVal);
                const matchesGenre = (genreVal === 'All') || (book.genre === genreVal);
                let matchesStock = true;
                if (stockVal === 'inStock') matchesStock = book.quantity > 5;
                if (stockVal === 'lowStock') matchesStock = book.quantity > 0 && book.quantity <= 5;
                if (stockVal === 'outOfStock') matchesStock = book.quantity == 0;
                return matchesSearch && matchesGenre && matchesStock;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-12 text-center"><i data-lucide="book-x" class="w-12 h-12 mx-auto text-slate-500 mb-3"></i><h3 class="text-lg font-medium text-slate-300">No books found</h3></div>`;
                lucide.createIcons();
                return;
            }

            if (currentView === 'grid') {
                container.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">${filtered.map(book => `
                    <div class="bg-slate-800 border border-slate-700/60 rounded-xl overflow-hidden flex flex-col group">
                        <div class="h-48 bg-slate-900 relative overflow-hidden flex items-center justify-center">
                            <img src="${book.cover}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <div class="absolute top-3 right-3">${getStockBadge(book.quantity)}</div>
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <div class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-1">${book.genre}</div>
                                <h3 class="font-bold text-white text-base line-clamp-1 mb-1">${book.title}</h3>
                                <p class="text-xs text-slate-400 mb-3">by ${book.author}</p>
                                <p class="text-xs font-mono text-slate-500">ISBN: ${book.isbn}</p>
                            </div>
                            <div class="pt-4 mt-4 border-t border-slate-700/60 flex items-center justify-between">
                                <span class="text-lg font-bold text-emerald-400">$${parseFloat(book.price).toFixed(2)}</span>
                                <div class="flex items-center gap-2">
                                    <button onclick="editBook('${book.id}')" class="p-2 text-slate-400 hover:text-white bg-slate-700/50 rounded"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                    <button onclick="deleteBook('${book.id}')" class="p-2 text-rose-400 hover:text-rose-300 bg-slate-700/50 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>`).join('')}</div>`;
            } else {
                container.innerHTML = `<div class="bg-slate-800 border border-slate-700/60 rounded-xl overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="border-b border-slate-700 bg-slate-800/80 text-xs text-slate-400"><th class="py-3 px-4">Title & Author</th><th class="py-3 px-4">ISBN</th><th class="py-3 px-4">Genre</th><th class="py-3 px-4">Price</th><th class="py-3 px-4">Stock Status</th><th class="py-3 px-4 text-right">Actions</th></tr></thead><tbody class="divide-y divide-slate-700/60 text-sm">${filtered.map(book => `<tr><td class="py-3 px-4"><div class="font-semibold text-white">${book.title}</div><div class="text-xs text-slate-400">${book.author}</div></td><td class="py-3 px-4 font-mono text-xs text-slate-400">${book.isbn}</td><td class="py-3 px-4 text-xs"><span class="px-2 py-1 rounded bg-slate-700 text-slate-300">${book.genre}</span></td><td class="py-3 px-4 font-semibold text-emerald-400">$${parseFloat(book.price).toFixed(2)}</td><td class="py-3 px-4">${getStockBadge(book.quantity)}</td><td class="py-3 px-4 text-right"><button onclick="editBook('${book.id}')" class="p-1.5 text-slate-400 hover:text-white"><i data-lucide="edit-3" class="w-4 h-4"></i></button><button onclick="deleteBook('${book.id}')" class="p-1.5 text-rose-400 hover:text-rose-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody></table></div>`;
            }
            lucide.createIcons();
        }

        function openModal(editId = null) {
            document.getElementById('book-form').reset();
            document.getElementById('book-id').value = '';
            if (editId) {
                const book = books.find(b => b.id === editId);
                if (book) {
                    document.getElementById('modal-title').innerText = 'Edit Book Details';
                    document.getElementById('book-id').value = book.id;
                    document.getElementById('field-title').value = book.title;
                    document.getElementById('field-author').value = book.author;
                    document.getElementById('field-isbn').value = book.isbn;
                    document.getElementById('field-genre').value = book.genre;
                    document.getElementById('field-price').value = book.price;
                    document.getElementById('field-quantity').value = book.quantity;
                    document.getElementById('field-cover').value = book.cover || '';
                }
            } else {
                document.getElementById('modal-title').innerText = 'Add New Book';
            }
            const modal = document.getElementById('book-modal');
            const card = document.getElementById('modal-card');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => card.classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('book-modal');
            const card = document.getElementById('modal-card');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.remove('flex'); modal.classList.add('hidden'); }, 200);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('book-id').value;
            const newBook = {
                id: id || Date.now().toString(),
                title: document.getElementById('field-title').value,
                author: document.getElementById('field-author').value,
                isbn: document.getElementById('field-isbn').value,
                genre: document.getElementById('field-genre').value,
                price: parseFloat(document.getElementById('field-price').value),
                quantity: parseInt(document.getElementById('field-quantity').value),
                cover: document.getElementById('field-cover').value || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400&q=80'
            };

            if (id) { books = books.map(b => b.id === id ? newBook : b); } 
            else { books.unshift(newBook); }

            saveBooks();
            closeModal();
        }

        function editBook(id) { openModal(id); }
        function deleteBook(id) { if (confirm('Remove this book from inventory?')) { books = books.filter(b => b.id !== id); saveBooks(); } }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(books, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `book_inventory.json`);
            dl.click();
            dl.remove();
        }

        updateStats();
        renderInventory();
    </script>
</body>
</html>
